{% extends "cart/base.html" %} {%block content %}
<div class="container py-5">
  <h1 class="mb-5">Seu carrinho</h1>
  <div class="row">
    <div class="col-lg-8">
      <div class="card mb-4">
        <div class="card-body">
          {%for item in items %}
          <div id="node-{{item.product.slug}}" class="row cart-item mb-3">
            <div class="col-md-3">
              <img
                src="{{item.product.image.url}}"
                alt=""
                class="img-fluid rounded"
              />
            </div>
            <div class="col-md-4">
              <h5 class="card-title">Perfume {{item.product.name}}</h5>
              <p class="text-muted">Categoria: Teste</p>
            </div>

            <div class="col-md-3">
              <form
                action="{% url 'cart:update_cart' item.product.slug %}"
                method="post"
                id="update-form-{{item.product.slug}}"
              >
                {% csrf_token %}
                <div class="input-group">
                  <input
                    type="number"
                    name="quantity"
                    value="{{item.quantity}}"
                    min="1"
                    class="form-control quantity-input"
                    id="quantity"
                    style="width: 80px"
                    onchange="showUpdateButton('update-form-{{item.product.slug}}')"
                  />
                </div>
                <div class=" mt-3" >
                    <button
                      type="submit"
                      class="btn btn-success confirm-btn"
                      style="display: none; width: 80px"
                      title="Update quantity"
                    >
                      <i class="fas fa-check"></i>
                    </button>
                  </div>
              </form>
            </div>

            <div class="col-md-2 text-end">
              <p class="fw-bold">R${{item.subtotal}}</p>
              <form
                action="{% url 'cart:remove_from_cart' item.product.slug %}"
                method="post"
              >
                {% csrf_token %}
                <button class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </div>
          <hr />
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card" style="background-color: #f8f9fa; border-radius: 10px">
        <div class="card-body">
          <h5 class="card-title mb-4">Produtos</h5>
          <hr />
          <div class="d-flex justify-content-between mb-4">
            <strong>Total</strong>
            <strong>R${{total}}</strong>
          </div>
          <a href="{% url 'cart:checkout' %}" class="btn btn-primary w-100">Finalizar Compra</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function showUpdateButton(formId) {
    const form = document.getElementById(formId);
    const input = form.querySelector(".quantity-input");
    const button = form.querySelector(".confirm-btn");
    button.style.display = "block";
  }
</script>

{%endblock%}
